name: Deploy Python Backend to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    name: Deploy via lftp
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "FTP_SERVER_DIR is the folder that contains app/, alembic/, passenger_wsgi.py"
            echo "on the server. Examples:"
            echo "  /admissionlife.cv/     (FTP user = main cPanel account)"
            echo "  /                      (FTP user chrooted to the domain folder)"
            echo "It must start and end with a slash."
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version | head -n 1

      - name: Request Passenger restart
        run: |
          mkdir -p tmp
          echo "deploy ${{ github.run_id }} $(date -u +%FT%TZ)" > tmp/restart.txt

      - name: Sync backend via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          set -euo pipefail

          if [ "${FTP_PROTOCOL}" = "ftp" ]; then
            SSL_SETTINGS="set ftp:ssl-allow off;"
          else
            SSL_SETTINGS="set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true;"
          fi

          # Add --delete to the mirror command below if you also want files removed
          # from the repo to disappear on the server (excludes protect .env, DBs, logs).
          lftp -c "
          set cmd:fail-exit true;
          set net:timeout 15;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          ${SSL_SETTINGS}
          open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ${FTP_SERVER};
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob .* \
            --exclude-glob *.pyc \
            --exclude-glob *.pyo \
            --exclude-glob __pycache__/ \
            --exclude-glob */__pycache__/ \
            --exclude-glob tests/ \
            --exclude-glob */tests/ \
            --exclude-glob requirements-dev.txt \
            --exclude-glob *.db \
            --exclude-glob *.db-wal \
            --exclude-glob *.db-shm \
            --exclude-glob *.sqlite \
            --exclude-glob *.sqlite3 \
            --exclude-glob backups/ \
            --exclude-glob *.log \
            ./ ${FTP_SERVER_DIR}
          "

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Backend deployment"
            echo ""
            echo "- Synced the backend repo to \`${{ secrets.FTP_SERVER_DIR }}\`"
            echo "- Passenger restart requested via \`tmp/restart.txt\`"
            echo ""
            echo "### After the first deploy (or when dependencies change)"
            echo "In cPanel -> Setup Python App, run inside the app virtualenv:"
            echo '```bash'
            echo "pip install -r requirements.txt"
            echo "python -m alembic upgrade head"
            echo "python scripts/doctor.py"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
